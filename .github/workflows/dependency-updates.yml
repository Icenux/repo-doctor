name: Týdenní aktualizace závislostí
# Každé pondělí přegeneruje zámky (requirements-dev.txt, requirements-build.txt) na nejnovější vyhovující verze,
# ověří je (ruff, mypy, pytest) a otevře PR `chore/weekly-dependency-update`. Nic nového = nic se nevytvoří.
# Akce GitHub Actions hlídá Dependabot (.github/dependabot.yml, také v pondělí).
#
# Dva joby: `update` spouští kód ze závislostí (pip-compile, pytest), proto nemá žádné secrety ani právo zápisu;
# `pr` jen vezme hotové zámky z artefaktu, pushne a otevře PR a žádný kód ze závislostí nespouští.
# Aby na PR běžela i CI, přidej secret DEPENDENCY_PR_TOKEN (fine-grained PAT jen pro toto repo, contents +
# pull requests: write).
# PR vytvořený výchozím GITHUB_TOKENEM CI nespouští – výsledek testů je pak v popisu PR.
# Ruční spuštění: Actions → "Týdenní aktualizace závislostí" → Run workflow.
on:
  schedule:
    - cron: "0 5 * * 1" # pondělí 05:00 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-updates
  cancel-in-progress: false
env:
  BRANCH: chore/weekly-dependency-update
jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      verify: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Zámky jsou generované Pythonem 3.12 (viz docs/DECISIONS.md), stejná verze musí běžet i tady.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: přegenerovat zámky
        run: |
          python -m pip install pip-tools==7.7.0
          pip-compile --upgrade --generate-hashes --allow-unsafe --strip-extras --extra dev -o requirements-dev.txt pyproject.toml
          pip-compile --upgrade --generate-hashes --allow-unsafe --strip-extras --extra build -o requirements-build.txt pyproject.toml
      - name: změnilo se něco?
        id: diff
        run: |
          if git diff --quiet -- requirements-dev.txt requirements-build.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Zámky jsou aktuální, není co dělat."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: seznam změn verzí
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p out
          python - <<'PY' > out/changes.md
          import re, subprocess
          def pins(text):
              return dict(re.findall(r"^([A-Za-z0-9_.\-]+)==([^\s\\]+)", text, re.M))
          for name in ("requirements-dev.txt", "requirements-build.txt"):
              old = pins(subprocess.run(["git", "show", f"HEAD:{name}"], capture_output=True, text=True, check=True).stdout)
              new = pins(open(name, encoding="utf-8").read())
              rows = [f"- `{k}`: {old.get(k, '–')} → {new.get(k, '–')}" for k in sorted(old.keys() | new.keys()) if old.get(k) != new.get(k)]
              print(f"### `{name}` ({len(rows)})")
              print("\n".join(rows) or "- beze změny")
              print()
          PY
          cat out/changes.md
          cp requirements-dev.txt requirements-build.txt out/
      - name: ověření (ruff, mypy, pytest)
        if: steps.diff.outputs.changed == 'true'
        id: verify
        continue-on-error: true
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
          ruff check src tests
          ruff format --check src tests
          mypy
          pytest -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: locks
          path: out/
          retention-days: 7

  pr:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locks
          path: ${{ runner.temp }}/locks
      - name: PR
        env:
          TOKEN: ${{ secrets.DEPENDENCY_PR_TOKEN || github.token }}
          VERIFY: ${{ needs.update.outputs.verify }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$TOKEN"
          cp "$RUNNER_TEMP/locks/requirements-dev.txt" "$RUNNER_TEMP/locks/requirements-build.txt" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add requirements-dev.txt requirements-build.txt
          git commit -m "chore(deps): týdenní aktualizace zamčených závislostí"
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="Authorization: Basic $auth" push --force origin "$BRANCH"
          if [ "$VERIFY" = "success" ]; then
            verdict="✅ Ruff, mypy a pytest na Pythonu 3.12 prošly."
            draft=""
          else
            verdict="❌ Ověření (ruff, mypy, pytest) selhalo – viz běh workflow, PR je proto koncept."
            draft="--draft"
          fi
          {
            echo "**Typ změny:** chore"
            echo
            echo "## Souhrn"
            echo "Automatická týdenní aktualizace zamčených závislostí (\`pip-compile --upgrade\`, Python 3.12, s hashi)."
            echo
            echo "## Co bylo změněno"
            cat "$RUNNER_TEMP/locks/changes.md"
            echo "## Jak ověřit"
            echo "$verdict"
            echo "Běh: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Na Pythonu 3.13 a ve snapshotech TUI ověří změnu CI tohoto PR (pokud neběží, spusť ji znovu tlačítkem „Re-run“ nebo PR zavři a znovu otevři)."
          } > "$RUNNER_TEMP/body.md"
          title="chore(deps): týdenní aktualizace zamčených závislostí"
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            # shellcheck disable=SC2086
            gh pr create --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "$title" --body-file "$RUNNER_TEMP/body.md" --assignee Luquas95 $draft
          fi
      - name: ověření selhalo
        if: needs.update.outputs.verify == 'failure'
        run: |
          echo "::error::Aktualizované závislosti neprošly ruff/mypy/pytest – PR je koncept."
          exit 1
