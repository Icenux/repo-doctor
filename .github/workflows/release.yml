name: Release
# Vydání se spouští tagem `X.Y.Z` bez `v` (musí přesně odpovídat verzi v pyproject.toml):
#   sestavení → test instalace na distribucích → GitHub Release.
# APT/RPM repozitář se tu nenasazuje: společný repozitář Icenux (github.com/Icenux/icenux)
# si nejnovější vydání vezme sám.
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"

jobs:
  build:
    # Pevná verze runneru, ne ubuntu-latest: setup-python v kontejneru použije Python z cache
    # hostitele (/__t). Na ubuntu-26.04 vyžaduje novější glibc, než má kontejner, a spadne
    # (GLIBC_2.38 not found). Na ubuntu-24.04 build prošel (0.4.0).
    runs-on: ubuntu-24.04
    # glibc 2.35 – sestavená aplikace poběží na Ubuntu 22.04+, Debianu 12+, Fedoře…
    container: ubuntu:22.04
    steps:
      - name: systémové nástroje
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils ca-certificates curl git gnupg
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: tag odpovídá verzi
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "$TAG" = "$version" || { echo "Tag $TAG ≠ verze $version v pyproject.toml"; exit 1; }
      - name: závislosti pro sestavení (zamčené, s kontrolou hashů)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: sestavení aplikace
        run: packaging/build.sh
      - name: nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: balíčky a podpis
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg" NFPM_RPM_KEY_FILE="$RUNNER_TEMP/signing.key"
          install -d -m 700 "$GNUPGHOME"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$NFPM_RPM_KEY_FILE")
          gpg --batch --quiet --import "$NFPM_RPM_KEY_FILE"
          packaging/package.sh
          packaging/sign.sh
          rm -f "$NFPM_RPM_KEY_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  test-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb }
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "fedora:42", kind: rpm }
          - { image: "archlinux:latest", kind: aur }
          - { image: "ubuntu:22.04", kind: tarball }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: rel
      - name: instalace (${{ matrix.kind }})
        env:
          KIND: ${{ matrix.kind }}
        run: |
          case "$KIND" in
            deb)
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$PWD/rel/repo-doctor_amd64.deb"
              test -f /etc/apt/sources.list.d/icenux.list
              test -f /usr/share/keyrings/icenux.asc ;;
            rpm)
              dnf install -y -q rel/repo-doctor.x86_64.rpm
              test -f /etc/yum.repos.d/icenux.repo ;;
            aur)
              pacman -Sy --noconfirm --needed base-devel git
              useradd -m builder && install -d -o builder /build
              cp rel/PKGBUILD /build/
              ver=$(sed -n 's/^pkgver=//p' rel/PKGBUILD)
              cp rel/repo-doctor-linux-x86_64.tar.gz "/build/repo-doctor-linux-x86_64-$ver.tar.gz"
              chown -R builder /build
              su builder -c "cd /build && makepkg --noconfirm"
              pacman -U --noconfirm /build/*.pkg.tar.zst ;;
            tarball)
              apt-get update -qq && apt-get install -y -qq git
              useradd -m user
              su user -c "cd ~ && tar xzf $PWD/rel/repo-doctor-linux-x86_64.tar.gz && ./repo-doctor/install.sh"
              ln -s /home/user/.local/bin/repo-doctor /usr/local/bin/repo-doctor ;;
          esac
      - name: aplikace běží
        env:
          KIND: ${{ matrix.kind }}
        run: |
          repo-doctor --version
          repo-doctor checks
          repo-doctor explain secrets-history > /dev/null
          installed=$(cat "$(dirname "$(readlink -f "$(command -v repo-doctor)")")/install-kind")
          test "$installed" = "${KIND/aur/pacman}"

  publish:
    needs: test-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release
          path: dist/release
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "repo-doctor ${TAG#v}" --notes-file notes.md \
            dist/release/repo-doctor_amd64.deb dist/release/repo-doctor.x86_64.rpm \
            dist/release/repo-doctor-linux-x86_64.tar.gz dist/release/PKGBUILD \
            dist/release/SHA256SUMS dist/release/SHA256SUMS.asc
