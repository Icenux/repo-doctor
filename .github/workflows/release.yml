name: Release
# Vydání se spouští tagem `X.Y.Z` bez `v` (musí přesně odpovídat verzi v pyproject.toml):
#   sestavení → test instalace na distribucích → GitHub Release.
# APT/RPM repozitář se tu nenasazuje: společný repozitář Icenux (github.com/Icenux/icenux)
# si nejnovější vydání vezme sám.
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NFPM_VERSION: "2.47.0"
  NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 2.35 – sestavená aplikace poběží na Ubuntu 22.04+, Debianu 12+, Fedoře…
    container: ubuntu:22.04
    steps:
      - name: systémové nástroje
        run: |
          # Síť v kontejneru občas na chvíli neumí DNS (0.4.2: „Could not resolve archive.ubuntu.com“,
          # apt-get update jen varuje a až install skončí kódem 100) – proto opakování celé dvojice.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          for pokus in 1 2 3 4 5; do
            apt-get update -qq \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq binutils ca-certificates curl git gnupg \
              && exit 0
            echo "apt selhal (pokus $pokus/5), čekám…"; sleep $((pokus * 10))
          done
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hostitelský runner mapuje svou cache nástrojů do kontejneru jako /__t a setup-python z ní
      # vezme hotový Python. Ten je sestavený pro novější glibc než 2.35 z kontejneru a hned při
      # spuštění spadne (GLIBC_2.38 not found). Bez cache hostitele setup-python stáhne build
      # pro Ubuntu 22.04 (ověřeno na ubuntu-latest i ubuntu-24.04).
      - name: Python z cache hostitele nejde v kontejneru spustit, smazat
        run: rm -rf /__t/Python
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: tag odpovídá verzi
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          test "$TAG" = "$version" || { echo "Tag $TAG ≠ verze $version v pyproject.toml"; exit 1; }
      - name: závislosti pro sestavení (zamčené, s kontrolou hashů)
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install --no-deps -e .
      - name: sestavení aplikace
        run: packaging/build.sh
      - name: nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: balíčky a podpis
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg" NFPM_RPM_KEY_FILE="$RUNNER_TEMP/signing.key"
          install -d -m 700 "$GNUPGHOME"
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$NFPM_RPM_KEY_FILE")
          gpg --batch --quiet --import "$NFPM_RPM_KEY_FILE"
          packaging/package.sh
          packaging/sign.sh
          rm -f "$NFPM_RPM_KEY_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  test-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12", kind: deb }
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "fedora:42", kind: rpm }
          - { image: "archlinux:latest", kind: aur }
          - { image: "archlinux:latest", kind: archpkg }
          - { image: "ubuntu:22.04", kind: tarball }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: rel
      - name: instalace (${{ matrix.kind }})
        env:
          KIND: ${{ matrix.kind }}
        run: |
          case "$KIND" in
            deb)
              apt-get -o Acquire::Retries=5 update -qq
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y -qq "$PWD/rel/repo-doctor_amd64.deb"
              test -f /etc/apt/sources.list.d/icenux.list
              test -f /usr/share/keyrings/icenux.asc ;;
            rpm)
              dnf install -y -q rel/repo-doctor.x86_64.rpm
              test -f /etc/yum.repos.d/icenux.repo ;;
            aur)
              pacman -Sy --noconfirm --needed base-devel git
              useradd -m builder && install -d -o builder /build
              cp rel/PKGBUILD /build/
              ver=$(sed -n 's/^pkgver=//p' rel/PKGBUILD)
              cp rel/repo-doctor-linux-x86_64.tar.gz "/build/repo-doctor-linux-x86_64-$ver.tar.gz"
              chown -R builder /build
              su builder -c "cd /build && makepkg --noconfirm"
              pacman -U --noconfirm /build/*.pkg.tar.zst ;;
            archpkg)
              pacman -Syu --noconfirm
              pacman -U --noconfirm rel/repo-doctor-*-x86_64.pkg.tar.zst ;;
            tarball)
              apt-get -o Acquire::Retries=5 update -qq && apt-get -o Acquire::Retries=5 install -y -qq git
              useradd -m user
              su user -c "cd ~ && tar xzf $PWD/rel/repo-doctor-linux-x86_64.tar.gz && ./repo-doctor/install.sh"
              ln -s /home/user/.local/bin/repo-doctor /usr/local/bin/repo-doctor ;;
          esac
      - name: aplikace běží
        env:
          KIND: ${{ matrix.kind }}
        run: |
          repo-doctor --version
          repo-doctor checks
          repo-doctor explain secrets-history > /dev/null
          installed=$(cat "$(dirname "$(readlink -f "$(command -v repo-doctor)")")/install-kind")
          expected=${KIND/aur/pacman}
          expected=${expected/archpkg/pacman}
          test "$installed" = "$expected"

  publish:
    needs: test-install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "repo-doctor ${TAG#v}" --notes-file notes.md \
            dist/release/repo-doctor_amd64.deb dist/release/repo-doctor.x86_64.rpm \
            dist/release/repo-doctor-*-x86_64.pkg.tar.zst \
            dist/release/repo-doctor-linux-x86_64.tar.gz dist/release/PKGBUILD \
            dist/release/SHA256SUMS dist/release/SHA256SUMS.asc

      - name: Notify the Icenux site
        # The site (Icenux/icenux.github.io) rebuilds on this event and picks up the new version.
        continue-on-error: true
        run: gh api repos/Icenux/icenux.github.io/dispatches -f event_type=app-released
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}

      - name: Notify the Icenux package repositories
        # The shared APT/RPM/pacman repository (Icenux/icenux) otherwise waits for its next scheduled run.
        continue-on-error: true
        run: gh api repos/Icenux/icenux/dispatches -f event_type=app-released
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
