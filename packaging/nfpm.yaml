# Balíčky .deb a .rpm ze sestavené aplikace (dist/repo-doctor) – volá packaging/package.sh.
# Balíček kromě aplikace při instalaci přidá společný repozitář Icenux a jeho podpisový klíč
# (postinst.sh), takže další verze už přicházejí běžnou aktualizací systému.
name: repo-doctor
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: devel
priority: optional
maintainer: repo-doctor contributors <https://github.com/Luquas95/repo-doctor>
description: |-
  TUI pro audit a údržbu lokálních git repozitářů.
  Najde bezpečnostní a hygienické problémy (tajemství, zranitelné závislosti, stav gitu,
  git hostingy), vyrobí přehledný report a bezpečně připraví opravy.
vendor: repo-doctor
homepage: https://github.com/Luquas95/repo-doctor
license: MIT

depends:
  - git

overrides:
  deb:
    recommends: [xdg-utils, libnotify-bin]
    suggests: [gitleaks, wl-clipboard]
  rpm:
    recommends: [xdg-utils, libnotify]
    suggests: [gitleaks, wl-clipboard]

scripts:
  postinstall: packaging/scripts/postinst.sh

contents:
  - src: dist/repo-doctor/
    dst: /usr/lib/repo-doctor
    type: tree
  - src: /usr/lib/repo-doctor/repo-doctor
    dst: /usr/bin/repo-doctor
    type: symlink

  # způsob instalace (repo-doctor podle něj radí, jak aktualizovat)
  - src: packaging/files/install-kind.deb
    dst: /usr/lib/repo-doctor/install-kind
    packager: deb
  - src: packaging/files/install-kind.rpm
    dst: /usr/lib/repo-doctor/install-kind
    packager: rpm

  # zdroj balíčků Icenux: soubory leží vedle aplikace, na místo je dá packaging/scripts/postinst.sh
  - src: src/repo_doctor/data/signing-key.asc
    dst: /usr/lib/repo-doctor/icenux.asc
  - src: packaging/files/icenux.list
    dst: /usr/lib/repo-doctor/icenux.list
    packager: deb
  - src: packaging/files/icenux.repo
    dst: /usr/lib/repo-doctor/icenux.repo
    packager: rpm

  - src: LICENSE
    dst: /usr/share/doc/repo-doctor/copyright
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/repo-doctor/LICENSE
    packager: rpm

rpm:
  summary: TUI pro audit a údržbu lokálních git repozitářů
  signature:
    key_file: ${NFPM_RPM_KEY_FILE}
